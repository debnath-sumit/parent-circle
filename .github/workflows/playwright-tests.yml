name: Build and Run Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App Code
        uses: actions/checkout@v4

      - name: Install App Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Docker Build
        run: |
          docker build
          -t parent-circle-app .

      - name: Run Docker Container
        run: |
          docker run -d
          -p 3001:3000
          --name parent-circle-app
          parent-circle-app

      - name: Wait for App to be Ready
        run: |
          echo 'Waiting for app to start...'
          for i in $(seq 1 20); do
            curl -s http://localhost:3001 && echo 'App is up!' && break
            echo "Attempt $i - not ready yet..."
            sleep 5
          done

      - name: Checkout Test Project
        uses: actions/checkout@v4
        with:
          repository: debnath-sumit/parent-circle-test
          path: parent-circle-test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Playwright Tests
        working-directory: parent-circle-test
        run: mvn clean test -Dbase.url=http://localhost:3001 -Dbrowser=chromium

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: parent-circle-test/target/surefire-reports/
